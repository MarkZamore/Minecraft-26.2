name: Publish Minecraft 26.2 pack

on:
  push:
    branches: [main]

concurrency:
  group: minecraft-26-2-pack-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # No disk-freeing step and no fetch of oversized files: this pack is a
      # manifest and one megabyte of mod. Everything it ships is in the tree.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate manifest and stage assets
        run: python tools/generate_manifest.py --pack . --out dist --revision "$GITHUB_SHA"

      - name: Self-check staged assets
        run: python tools/generate_manifest.py --pack . --out dist --verify-only

      - name: Publish pack-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The release is updated in place and never deleted. Deleting it first
          # is what took the LL8 pack offline three times in one week: the
          # delete always works and the create after it is the call GitHub
          # refuses, so every launcher asking for pack-latest gets a 404 until
          # somebody restarts the run by hand. Nothing here takes anything away
          # before its replacement is in place.

          retry() {
            local what="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "$what failed (attempt $attempt/5)" >&2
              sleep $((attempt * 10))
            done
            echo "$what failed after 5 attempts" >&2
            return 1
          }

          git tag -f pack-latest "$GITHUB_SHA"
          git push -f origin refs/tags/pack-latest ||
            echo "pack-latest tag could not be moved; the release still carries this run's assets" >&2

          if gh release view pack-latest >/dev/null 2>&1; then
            retry "Release edit" gh release edit pack-latest \
              --title "Minecraft 26.2 pack" \
              --notes "Rolling Minecraft 26.2 pack release. Revision: $GITHUB_SHA"
          else
            retry "Release create" gh release create pack-latest \
              --target "$GITHUB_SHA" \
              --title "Minecraft 26.2 pack" \
              --notes "Rolling Minecraft 26.2 pack release. Revision: $GITHUB_SHA"
          fi

          # Every asset is named <kind>-<the first twelve of its sha256>-<file>,
          # so a name already on the release, whole and the same size, is the
          # same bytes and does not need sending again.
          gh release view pack-latest --json assets \
            --jq '.assets[] | select(.state == "uploaded") | "\(.name)|\(.size)"' | sort > on-release.txt

          upload_batch() {
            retry "Upload batch" gh release upload pack-latest "$@" --clobber
          }

          kept=0
          sent=0
          batch=()
          : > wanted.txt
          for f in dist/assets/*; do
            name="$(basename "$f")"
            echo "$name" >> wanted.txt
            if grep -qxF "$name|$(stat -c %s "$f")" on-release.txt; then
              kept=$((kept + 1))
              continue
            fi
            batch+=("$f")
            sent=$((sent + 1))
            if [ "${#batch[@]}" -eq 40 ]; then
              upload_batch "${batch[@]}"
              batch=()
            fi
          done
          if [ "${#batch[@]}" -gt 0 ]; then
            upload_batch "${batch[@]}"
          fi

          # The manifest goes up last and always: it is what the launcher reads
          # to know what the pack is, and until it changes the release still
          # describes, completely, the pack that was there before.
          echo "pack-manifest.json" >> wanted.txt
          upload_batch dist/pack-manifest.json

          # Only now, with the new manifest live and everything it names beside
          # it, do the files nothing names any more come off.
          cut -d'|' -f1 on-release.txt | sort > had.txt
          sort -o wanted.txt wanted.txt
          gone=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            retry "Asset delete" gh release delete-asset pack-latest "$name" --yes
            gone=$((gone + 1))
          done < <(comm -23 had.txt wanted.txt)
          echo "$kept asset(s) already published, $sent uploaded, $gone removed"
